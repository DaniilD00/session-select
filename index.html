<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preload" as="image" href="/logotyp_1.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Single Page Apps for GitHub Pages — restores the real URL after the
         404.html redirect (MIT, https://github.com/rafgraph/spa-github-pages).
         Must run before the app mounts so React Router sees the correct path.
         404.html sends deep links to the Ronneby home page (/ronneby/?/path),
         and the encoded path is always the full path from the site root, so
         the shell page's own pathname is dropped rather than prepended. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, decoded + l.hash);
        }
      }(window.location));
    </script>

    <!-- Apply the visitor's saved light/dark choice before first paint (see src/lib/theme.ts). -->
    <script type="text/javascript">
      try { document.documentElement.dataset.theme = localStorage.getItem('rpg-theme') === 'light' ? 'light' : 'dark'; } catch (e) {}
    </script>

    <!-- The build fills #root with a plain-HTML copy of each page
         (scripts/prerender-content.tsx) for crawlers that don't run JS.
         Browsers that do run JS hide it until React replaces it, so visitors
         see the same first paint as before. -->
    <script type="text/javascript">document.documentElement.classList.add('rpg-js');</script>
    <style>
      .rpg-js .rpg-static { display: none; }
      .rpg-static { max-width: 48rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; font-family: system-ui, sans-serif; line-height: 1.6; }
      .rpg-static header nav, .rpg-static footer nav ul { display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; padding: 0; list-style: none; }
    </style>

    <!-- Security headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://challenges.cloudflare.com https://*.contentsquare.net; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://*.stripe.com https://challenges.cloudflare.com https://*.contentsquare.net https://*.contentsquare.com; worker-src 'self' blob:; frame-src 'self' data: about: https://js.stripe.com https://hooks.stripe.com https://challenges.cloudflare.com https://maps.google.com https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com;" />

    <!-- Head defaults are Ronneby's (Solna closed permanently in Sept 2026).
         scripts/prerender-routes.ts rewrites them per route from the
         LocationConfig, so keep every tag below — the build fails if one goes. -->
    <title>LED-arkad i Ronneby – aktivitet i Blekinge | Ready Pixel Go</title>
    <meta name="description" content="Ready Pixel Go i Ronneby: interaktiv LED-arkad där golvet är spelplanen. Barnkalas, teambuilding och familjeaktivitet i Blekinge – nära Karlskrona. Boka online!">
    <meta name="keywords" content="aktiviteter i Ronneby, roliga aktiviteter Blekinge, barnkalas Ronneby, teambuilding Blekinge, inomhusaktivitet Ronneby, LED arkad Ronneby, readypixelgo, ready pixel go">
    <meta name="author" content="Ready Pixel Go" />
    <link rel="canonical" href="https://readypixelgo.se/ronneby/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- No hreflang alternates: Swedish and English share one URL (the
         language is switched client-side), and hreflang requires a separate
         URL per language. Listing one URL for several languages is an error. -->

    <!-- Geo targeting for Swedish local search -->
    <meta name="geo.region" content="SE-K" />
    <meta name="geo.placename" content="Ronneby" />
    <meta name="geo.position" content="56.20962931949452;15.279178103376813" />
    <meta name="ICBM" content="56.20962931949452, 15.279178103376813" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://readypixelgo.se/ronneby/" />
    <meta property="og:title" content="LED-arkad i Ronneby – aktivitet i Blekinge | Ready Pixel Go">
    <meta property="og:description" content="Ready Pixel Go i Ronneby: interaktiv LED-arkad där golvet är spelplanen. Barnkalas, teambuilding och familjeaktivitet i Blekinge – nära Karlskrona. Boka online!">
    <meta property="og:image" content="https://readypixelgo.se/social/og-ronneby.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ready Pixel Go – LED-arcade i Ronneby" />
    <meta property="og:locale" content="sv_SE" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta property="og:site_name" content="Ready Pixel Go" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LED-arkad i Ronneby – aktivitet i Blekinge | Ready Pixel Go">
    <meta name="twitter:description" content="Ready Pixel Go i Ronneby: interaktiv LED-arkad där golvet är spelplanen. Barnkalas, teambuilding och familjeaktivitet i Blekinge – nära Karlskrona. Boka online!">
    <meta name="twitter:image" content="https://readypixelgo.se/social/og-ronneby.jpg" />
    <meta name="twitter:image:alt" content="Ready Pixel Go – LED-arcade i Ronneby" />
    
    <!-- Structured data (LocalBusiness JSON-LD) is emitted per route at build
         time by scripts/prerender-routes.ts, straight from the LocationConfig,
         so it can never drift from the venue's real address and hours. -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
